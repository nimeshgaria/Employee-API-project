name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag / Git SHA to rollback to"
        required: true
        type: string

jobs:
  rollback:
    name: Rollback to Previous Version
    runs-on: ubuntu-latest

    steps:
      - name: Rollback application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu/Employee-API-project

            export IMAGE_TAG=${{ inputs.image_tag }}

            echo "Rolling back to:"
            echo "nimesh25/employee-api:${IMAGE_TAG}"

            docker compose pull employee-api
            docker compose up -d employee-api

            echo "Deployment status:"
            docker compose ps

            echo "Running image:"
            docker inspect employee-api --format '{{.Config.Image}}'