name: CI

on:
  push:
    branches:
      - main
      - feature/add-employee-api

  pull_request:
    branches:
      - main


jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest -v


  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t nimesh25/employee-api:${{ github.sha }} \
            -t nimesh25/employee-api:latest \
            .

      - name: Push Docker image
        run: |
          docker push nimesh25/employee-api:${{ github.sha }}
          docker push nimesh25/employee-api:latest


  deploy:
    name: Deploy to EC2
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Employee-API-project

            export IMAGE_TAG=${{ github.sha }}

            docker compose pull employee-api
            docker compose up -d employee-api

            docker compose ps